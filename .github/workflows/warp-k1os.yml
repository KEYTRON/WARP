name: WARP K1OS

on:
  push:
    paths:
      - "README.md"
      - "README.ru.md"
      - ".github/workflows/warp-k1os.yml"
  pull_request:
    paths:
      - "README.md"
      - "README.ru.md"
      - ".github/workflows/warp-k1os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner: k1lab-k1os-x86_64
            lane: x86_64
          - runner: k1arm-k1os
            lane: arm
    runs-on: ${{ matrix.runner }}
    # One build per architecture across all distros: the lab PC has ~2.8 GB
    # free and the OrbStack VM 3.9 GB, so two parallel builds are the limit.
    concurrency:
      group: warp-distro-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - name: Pull K1OS image
        run: docker pull ghcr.io/keytron/k1os:latest

      - name: Smoke test WARP in K1OS
        run: docker run --rm ghcr.io/keytron/k1os:latest /bin/sh -lc 'warp --version && warp --help >/dev/null'
