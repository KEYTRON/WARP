name: WARP K1OS

on:
  push:
    paths:
      - "README.md"
      - "README.ru.md"
      - ".github/workflows/warp-k1os.yml"
  pull_request:
    paths:
      - "README.md"
      - "README.ru.md"
      - ".github/workflows/warp-k1os.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, k1lab, warp]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.k1os -t warp:k1os .
      - name: Smoke test
        run: |
          docker run --rm warp:k1os --version
          docker run --rm warp:k1os --help
