name: WARP macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [macOS, ARM64, k1mac]
    steps:
      - uses: actions/checkout@v4
      - name: Report the platform
        run: |
          sw_vers
          uname -m
      - name: Build
        # The runner works in a checkout of its own, but object files from a
        # Linux build must never be linked on macOS: clang cannot read them.
        run: |
          make clean
          make -j"$(sysctl -n hw.ncpu)"
      - name: Platform is macOS on arm64
        run: ./warp --version
      - name: Crypto vectors
        run: sh tests/crypto.sh
      - name: Delta round trip
        run: sh tests/delta-roundtrip.sh
      - name: Versions side by side
        run: |
          env | sort | grep -iE "proxy|curl|ssl|cert|lang|^lc_|^path=|^tmpdir|^home=" || true
          sh -x tests/versions.sh 2>&1 | tail -60
          exit ${PIPESTATUS[0]}
      - name: Platforms and libc
        run: sh tests/multi-platform.sh
      - name: Node and anonymous statistics
        run: sh tests/node-stats.sh
      - name: Report what the node would send
        run: ./warp stats --what || true