name: WARP Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner: k1lab-ubuntu-x86_64
            lane: x86_64
          - runner: k1arm-ubuntu
            lane: arm
    runs-on: ${{ matrix.runner }}
    # One build per architecture across all distros: the lab PC has ~2.8 GB
    # free and the OrbStack VM 3.9 GB, so two parallel builds are the limit.
    concurrency:
      group: warp-distro-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.ubuntu -t warp:ubuntu .
      - name: Smoke test
        run: |
          docker run --rm warp:ubuntu --version
          docker run --rm warp:ubuntu --help
