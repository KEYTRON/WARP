name: WARP distros

# Every distro on both architectures. One workflow with a matrix, because GitHub
# keeps only one pending job per concurrency group: ten separate workflows
# sharing a group would cancel eight of them the moment a push arrived.
#
# Two jobs, one per architecture, each with max-parallel: 1, so exactly two
# builds run at a time. The lab PC has about 2.8 GB free and the OrbStack VM
# 3.9 GB; twenty parallel distro builds would swap both machines to a halt.
#
# runs-on matches labels, not runner names. The x86_64 runners carry
# k1lab + warp + the distro label, the arm ones carry aarch64 + the same label,
# so the distro label alone sends each job to its own pair of runners.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64:
    name: ${{ matrix.distro }} x86_64
    runs-on: [self-hosted, k1lab, warp, ${{ matrix.distro }}]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [almalinux, alpine, arch, artix, devuan, fedora, ubuntu, void, void-musl, k1os]
    steps:
      - uses: actions/checkout@v4
      - name: Report the runner
        run: |
          uname -m
          echo "distro: ${{ matrix.distro }}"
      - name: Build image
        run: docker build -f docker/Dockerfile.${{ matrix.distro }} -t warp:${{ matrix.distro }} .
      - name: Smoke test
        run: |
          docker run --rm warp:${{ matrix.distro }} --version
          docker run --rm warp:${{ matrix.distro }} --help
      - name: The binary is really x86_64
        run: docker run --rm --entrypoint sh warp:${{ matrix.distro }} -c 'uname -m'

  arm:
    name: ${{ matrix.distro }} arm
    runs-on: [self-hosted, aarch64, ${{ matrix.distro }}]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        distro: [almalinux, alpine, arch, artix, devuan, fedora, ubuntu, void, void-musl, k1os]
    steps:
      - uses: actions/checkout@v4
      - name: Report the runner
        run: |
          uname -m
          docker info --format 'engine architecture: {{.Architecture}}'
          echo "distro: ${{ matrix.distro }}"
      - name: Build image
        run: docker build -f docker/Dockerfile.${{ matrix.distro }} -t warp:${{ matrix.distro }} .
      - name: Smoke test
        run: |
          docker run --rm warp:${{ matrix.distro }} --version
          docker run --rm warp:${{ matrix.distro }} --help
      - name: The binary is really aarch64
        run: docker run --rm --entrypoint sh warp:${{ matrix.distro }} -c 'uname -m'