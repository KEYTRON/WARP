name: WARP Alpine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# All distro workflows share one group, so exactly one distro builds at a time
# and only its two jobs (x86_64 and arm) run in parallel. The lab PC has ~2.8 GB
# free and the OrbStack VM 3.9 GB, and twenty parallel distro builds would
# swap both to a halt.
concurrency:
  group: warp-distro-builds
  cancel-in-progress: false

jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner: k1lab-alpine-x86_64
          - runner: k1arm-alpine
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.alpine -t warp:alpine .
      - name: Smoke test
        run: |
          docker run --rm warp:alpine --version
          docker run --rm warp:alpine --help
