name: WARP Void glibc

# Per-distro run for debugging one distro on its own. The push trigger lives
# in warp-distros.yml: GitHub keeps only one pending job per concurrency group,
# so ten separate workflows sharing a group would cancel eight of them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, k1lab, warp]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.void -t warp:void .
      - name: Smoke test
        run: |
          docker run --rm warp:void --version
          docker run --rm warp:void --help
