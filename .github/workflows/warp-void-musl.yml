name: WARP Void Musl

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - runner: k1lab-void-musl-x86_64
            lane: x86_64
          - runner: k1arm-void-musl
            lane: arm
    runs-on: ${{ matrix.runner }}
    # One build per architecture across all distros: the lab PC has ~2.8 GB
    # free and the OrbStack VM 3.9 GB, so two parallel builds are the limit.
    concurrency:
      group: warp-distro-${{ matrix.lane }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.void-musl -t warp:void-musl .
      - name: Smoke test
        run: |
          docker run --rm warp:void-musl --version
          docker run --rm warp:void-musl --help
